name: EAS Build & Submit — iOS (TestFlight)

# Manual only: this builds and submits a real iOS build to App Store
# Connect / TestFlight, which consumes EAS build credits and creates a
# build number on Apple's side. Not something to trigger on every push.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile (see eas.json)"
        required: true
        default: production
        type: choice
        options:
          - production
          - preview

concurrency:
  group: eas-build-submit-ios
  cancel-in-progress: false

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: bun
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build iOS and submit to TestFlight
        run: eas build --platform ios --profile ${{ github.event.inputs.profile }} --non-interactive --auto-submit
