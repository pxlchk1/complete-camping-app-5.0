name: EAS Build & Submit — iOS (TestFlight)

# Manual only: this builds a real iOS build, consuming EAS build credits
# and (for production) creating a build number on Apple's side. Not
# something to trigger on every push. Only the production profile
# auto-submits to App Store Connect / TestFlight - eas.json has no submit
# target configured for preview, which is internal/ad-hoc distribution
# only (install via the EAS build page, no App Store involvement).
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile (see eas.json)"
        required: true
        default: production
        type: choice
        options:
          - production
          - preview

concurrency:
  group: eas-build-submit-ios
  cancel-in-progress: false

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    # The iOS build itself typically finishes in under 10 minutes, but
    # `--auto-submit` then waits on Apple's App Store Connect processing,
    # which has been observed taking upwards of an hour. A 60-minute limit
    # was killing the job mid-wait (build already succeeded and uploaded;
    # only the CLI's polling got cut off) and reporting a misleading
    # "cancelled" run instead of the real outcome.
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: bun
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build iOS
        if: github.event.inputs.profile != 'production'
        run: eas build --platform ios --profile ${{ github.event.inputs.profile }} --non-interactive

      - name: Build iOS and submit to TestFlight
        if: github.event.inputs.profile == 'production'
        run: eas build --platform ios --profile ${{ github.event.inputs.profile }} --non-interactive --auto-submit
