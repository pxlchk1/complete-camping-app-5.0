name: EAS Build — Android

# Manual only: this builds a real Android build, consuming EAS build
# credits. Not something to trigger on every push.
#
# Build-only for now, no --auto-submit: eas.json's Play Store submit
# profile needs a google-play-service-account.json key that doesn't
# exist yet (requires a Google Play Console service account - a
# separate setup step). Once that's added, this can mirror the iOS
# workflow's auto-submit-on-production behavior.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile (see eas.json)"
        required: true
        default: preview
        type: choice
        options:
          - production
          - preview
          - development

concurrency:
  group: eas-build-android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: bun
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Android
        run: eas build --platform android --profile ${{ github.event.inputs.profile }} --non-interactive
